server.port=8080

# Expose the gateway actuator endpoint so you can inspect the routes: http://localhost:8080/actuator/gateway/routes
management.endpoints.web.exposure.include=health,info,gateway

# lb://<service-name> = "ask Eureka where <service-name> is, and load-balance across its instances"
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users,/users/**

spring.cloud.gateway.server.webflux.routes[1].id=hotel-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://hotel-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/hotels,/hotels/**

spring.cloud.gateway.server.webflux.routes[2].id=rating-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://rating-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/ratings,/ratings/**
