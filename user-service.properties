server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true

# decide from the last 6 calls, but only once at least 3 have happened
resilience4j.circuitbreaker.configs.default.slidingWindowSize=6
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=3
# open the circuit when 50% or more of those calls failed
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
# stay OPEN (fail fast, no call made) for 10 s, then let 2 trial calls through (HALF-OPEN)
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=2
# a call slower than this counts as a failure (the library default is only 1 second - too strict for a cold start)
resilience4j.timelimiter.configs.default.timeoutDuration=5s
